name: Portfolio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Tests, production build and static export
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Production build
        run: npm run build
      - name: GitHub Pages export smoke test (no deployment)
        env:
          PORTFOLIO_STATIC_EXPORT: '1'
          NEXT_PUBLIC_BASE_PATH: '/portfolio'
          NEXT_PUBLIC_SITE_URL: 'https://ilmuratore.github.io/portfolio'
        run: |
          rm -rf .next out
          npm run build
          test -f out/index.html
          test -f out/robots.txt
          test -f out/sitemap.xml
          test -f out/about/index.html
          test -f out/contact/index.html
          grep -q 'noindex' out/about/index.html
          grep -q 'noindex' out/contact/index.html
          test -f out/projects/index.html
          test -f out/projects/progetto-01/index.html
          test -f out/projects/progetto-02/index.html
          test -f out/projects/progetto-03/index.html
          grep -q 'noindex' out/projects/index.html
          grep -q 'noindex' out/projects/progetto-01/index.html
          grep -q '/portfolio/projects/progetto-01/' out/projects/index.html
